name: Build BOM Manager Desktop Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bom-manager-desktop/**"
      - ".github/workflows/build-bom-manager-desktop.yml"

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller keyring
          choco install innosetup --yes --no-progress

      - name: Check Python syntax
        run: python -m py_compile bom-manager-desktop/app.py

      - name: Build desktop application
        working-directory: bom-manager-desktop
        run: pyinstaller --noconfirm --clean --windowed --name CraneVehicleBOMManager --collect-all keyring app.py

      - name: Build one-click installer
        working-directory: bom-manager-desktop
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CraneVehicleBOMManager-Setup-Windows
          path: bom-manager-desktop/output/CraneVehicleBOMManager_Setup.exe
          if-no-files-found: error
          retention-days: 30
