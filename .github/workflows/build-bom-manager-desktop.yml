name: Build BOM Manager Desktop Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bom-manager-desktop/**"
      - ".github/workflows/build-bom-manager-desktop.yml"

permissions:
  contents: write

concurrency:
  group: bom-manager-release
  cancel-in-progress: false

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read and validate app version
        id: version
        shell: pwsh
        run: |
          $version=(Get-Content bom-manager-desktop/VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid BOM Manager VERSION: $version" }
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=bom-v$version" >> $env:GITHUB_OUTPUT

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller keyring xlsxwriter reportlab PySide6
          choco install innosetup --yes --no-progress

      - name: Check Python syntax
        run: |
          python -m py_compile bom-manager-desktop/app.py
          python -m py_compile bom-manager-desktop/updater.py
          python -m py_compile bom-manager-desktop/bom_core.py
          python -m py_compile bom-manager-desktop/bom_reports.py
          python -m py_compile bom-manager-desktop/bom_ui.py
          python -m py_compile bom-manager-desktop/bom_qt.py
          python -m py_compile bom-manager-desktop/bom_qt_theme.py
          python -m py_compile bom-manager-desktop/qt_launcher.py

      - name: Run updater and GUI tests (offscreen)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s bom-manager-desktop/tests -v

      - name: Build desktop application
        working-directory: bom-manager-desktop
        run: pyinstaller --noconfirm --clean --windowed --name CraneVehicleBOMManager --collect-all keyring --collect-all reportlab --collect-all xlsxwriter --add-data "VERSION;." qt_launcher.py

      - name: Smoke-test Windows EXE and capture real dashboard preview
        working-directory: bom-manager-desktop
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = ".\dist\CraneVehicleBOMManager\CraneVehicleBOMManager.exe"
          if (!(Test-Path $exe)) { throw "Built EXE is missing" }
          $process = Start-Process -FilePath $exe -ArgumentList "--capture-preview" -PassThru
          if (-not $process.WaitForExit(90000)) {
            $process.Kill()
            throw "Windows EXE smoke test timed out"
          }
          if ($process.ExitCode -ne 0) { throw "Windows EXE smoke test failed ($($process.ExitCode))" }
          if (!(Test-Path "output\IndustrialDarkPreview.png")) {
            throw "GUI preview screenshot was not generated"
          }
          if (!(Test-Path "output\DebugReportPreview.png")) {
            throw "Debug Report screenshot was not generated"
          }

      - name: Build one-click installer
        working-directory: bom-manager-desktop
        shell: pwsh
        run: |
          $version="${{ steps.version.outputs.value }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer.iss

      - name: Prepare SHA256 checksum
        working-directory: bom-manager-desktop/output
        shell: pwsh
        run: |
          $filename="CraneVehicleBOMManager_Setup.exe"
          $hash=(Get-FileHash -Algorithm SHA256 $filename).Hash.ToLowerInvariant()
          "$hash  $filename" | Set-Content -Encoding ascii "$filename.sha256"
          Get-Content "$filename.sha256"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CraneVehicleBOMManager-Setup-Windows
          path: |
            bom-manager-desktop/output/CraneVehicleBOMManager_Setup.exe
            bom-manager-desktop/output/CraneVehicleBOMManager_Setup.exe.sha256
            bom-manager-desktop/output/IndustrialDarkPreview.png
            bom-manager-desktop/output/DebugReportPreview.png
          if-no-files-found: error
          retention-days: 30

      - name: Publish dedicated BOM Manager Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BOM_TAG: ${{ steps.version.outputs.tag }}
          BOM_VER: ${{ steps.version.outputs.value }}
        run: |
          $installer="bom-manager-desktop/output/CraneVehicleBOMManager_Setup.exe"
          $checksum="$installer.sha256"
          $preview="bom-manager-desktop/output/IndustrialDarkPreview.png"
          $debugPreview="bom-manager-desktop/output/DebugReportPreview.png"
          gh release view $env:BOM_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "::warning::BOM release $env:BOM_TAG already exists. Increment bom-manager-desktop/VERSION to publish a new version."
            exit 0
          }
          gh release create $env:BOM_TAG $installer $checksum $preview $debugPreview --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --latest=false --title "Crane Vehicle BOM Manager v$env:BOM_VER" --notes "Windows installer for BOM Manager v$env:BOM_VER. Includes in-app Check Version / Update Now, SHA256 validation, and GitHub BOM sync."
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release creation failed" }
