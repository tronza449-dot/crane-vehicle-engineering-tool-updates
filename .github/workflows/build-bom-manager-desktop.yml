name: Build BOM Manager Desktop Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bom-manager-desktop/**"
      - ".github/workflows/build-bom-manager-desktop.yml"

permissions:
  contents: write

concurrency:
  group: bom-manager-release
  cancel-in-progress: true

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read and validate app version
        id: version
        shell: pwsh
        run: |
          $version=(Get-Content bom-manager-desktop/VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid BOM Manager VERSION: $version" }
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=bom-v$version" >> $env:GITHUB_OUTPUT

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller keyring xlsxwriter reportlab PySide6 pymupdf
          choco install innosetup --yes --no-progress

      - name: Check Python syntax
        run: |
          python -m py_compile bom-manager-desktop/app.py
          python -m py_compile bom-manager-desktop/updater.py
          python -m py_compile bom-manager-desktop/bom_core.py
          python -m py_compile bom-manager-desktop/bom_advanced.py
          python -m py_compile bom-manager-desktop/bom_import_excel.py
          python -m py_compile bom-manager-desktop/bom_purchase_pdf.py
          python -m py_compile bom-manager-desktop/bom_reports.py
          python -m py_compile bom-manager-desktop/bom_official_reports.py
          python -m py_compile bom-manager-desktop/generate_report_samples.py
          python -m py_compile bom-manager-desktop/render_report_preview.py
          python -m py_compile bom-manager-desktop/bom_ui.py
          python -m py_compile bom-manager-desktop/bom_qt.py
          python -m py_compile bom-manager-desktop/bom_qt_theme.py
          python -m py_compile bom-manager-desktop/qt_launcher.py

      - name: Run updater and GUI tests (offscreen)
        timeout-minutes: 10
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s bom-manager-desktop/tests -v

      - name: Generate formal PDF and Excel report examples
        working-directory: bom-manager-desktop
        shell: pwsh
        run: python generate_report_samples.py

      - name: Render and inspect formal PDF document pages
        working-directory: bom-manager-desktop
        shell: pwsh
        run: python render_report_preview.py

      - name: Build desktop application
        working-directory: bom-manager-desktop
        run: pyinstaller --noconfirm --clean --windowed --name CraneVehicleBOMManager --collect-all keyring --collect-all reportlab --collect-all xlsxwriter --add-data "VERSION;." qt_launcher.py

      - name: Smoke-test Windows EXE and capture real dashboard preview
        working-directory: bom-manager-desktop
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = ".\dist\CraneVehicleBOMManager\CraneVehicleBOMManager.exe"
          if (!(Test-Path $exe)) { throw "Built EXE is missing" }
          $process = Start-Process -FilePath $exe -ArgumentList "--capture-preview" -PassThru
          if (-not $process.WaitForExit(90000)) {
            $process.Kill()
            throw "Windows EXE smoke test timed out"
          }
          if ($process.ExitCode -ne 0) { throw "Windows EXE smoke test failed ($($process.ExitCode))" }
          if (!(Test-Path "output\MinimalDashboardPreview.png")) {
            throw "Minimal Engineering dashboard preview was not generated"
          }
          if (!(Test-Path "output\MinimalBOMPreview.png")) {
            throw "Minimal Engineering BOM preview was not generated"
          }
          if (!(Test-Path "output\MinimalFormPreview.png")) {
            throw "Minimal Engineering item editor preview was not generated"
          }
          if (!(Test-Path "output\MinimalReportsPreview.png")) {
            throw "Minimal Engineering export preview was not generated"
          }
          if (!(Test-Path "output\DebugReportPreview.png")) {
            throw "Debug Report screenshot was not generated"
          }
          if (!(Test-Path "output\ReadableBOMPreview.png")) {
            throw "Readability zoom screenshot was not generated"
          }

      - name: Build one-click installer
        working-directory: bom-manager-desktop
        shell: pwsh
        run: |
          $version="${{ steps.version.outputs.value }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer.iss

      - name: Prepare SHA256 checksum
        working-directory: bom-manager-desktop/output
        shell: pwsh
        run: |
          $filename="CraneVehicleBOMManager_Setup.exe"
          $hash=(Get-FileHash -Algorithm SHA256 $filename).Hash.ToLowerInvariant()
          "$hash  $filename" | Set-Content -Encoding ascii "$filename.sha256"
          Get-Content "$filename.sha256"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CraneVehicleBOMManager-Setup-Windows
          path: |
            bom-manager-desktop/output/CraneVehicleBOMManager_Setup.exe
            bom-manager-desktop/output/CraneVehicleBOMManager_Setup.exe.sha256
            bom-manager-desktop/output/MinimalDashboardPreview.png
            bom-manager-desktop/output/MinimalBOMPreview.png
            bom-manager-desktop/output/MinimalFormPreview.png
            bom-manager-desktop/output/MinimalReportsPreview.png
            bom-manager-desktop/output/DebugReportPreview.png
            bom-manager-desktop/output/ReadableBOMPreview.png
            bom-manager-desktop/output/EngineeringBOM_Example.pdf
            bom-manager-desktop/output/EngineeringBOM_Example.xlsx
            bom-manager-desktop/output/EngineeringBOM_Cover.png
            bom-manager-desktop/output/EngineeringBOM_Table.png
          if-no-files-found: error
          retention-days: 30

      - name: Publish dedicated BOM Manager Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BOM_TAG: ${{ steps.version.outputs.tag }}
          BOM_VER: ${{ steps.version.outputs.value }}
        run: |
          $installer="bom-manager-desktop/output/CraneVehicleBOMManager_Setup.exe"
          $checksum="$installer.sha256"
          $preview="bom-manager-desktop/output/MinimalDashboardPreview.png"
          $bomPreview="bom-manager-desktop/output/MinimalBOMPreview.png"
          $formPreview="bom-manager-desktop/output/MinimalFormPreview.png"
          $reportPreview="bom-manager-desktop/output/MinimalReportsPreview.png"
          $debugPreview="bom-manager-desktop/output/DebugReportPreview.png"
          $readablePreview="bom-manager-desktop/output/ReadableBOMPreview.png"
          $pdf="bom-manager-desktop/output/EngineeringBOM_Example.pdf"
          $excel="bom-manager-desktop/output/EngineeringBOM_Example.xlsx"
          $cover="bom-manager-desktop/output/EngineeringBOM_Cover.png"
          $tablePreview="bom-manager-desktop/output/EngineeringBOM_Table.png"
          gh release view $env:BOM_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "::warning::BOM release $env:BOM_TAG already exists. Increment bom-manager-desktop/VERSION to publish a new version."
            exit 0
          }
          gh release create $env:BOM_TAG $installer $checksum $preview $bomPreview $formPreview $reportPreview $debugPreview $readablePreview $pdf $excel $cover $tablePreview --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --latest=false --title "Crane Vehicle BOM Manager v$env:BOM_VER" --notes "Windows installer for BOM Manager v$env:BOM_VER. Includes in-app Check Version / Update Now, SHA256 validation, and GitHub BOM sync."
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release creation failed" }
