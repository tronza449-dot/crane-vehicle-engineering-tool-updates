name: Deep Engineering Formula and UI Regression

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/engineering-audit.yml

permissions:
  contents: read

jobs:
  deep-audit:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Formula independent test
        shell: pwsh
        run: |
          $env:PYTHONPATH=(Get-Location).Path
          python -u tests/formula_audit.py *>&1 | Tee-Object -FilePath formula-audit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Full desktop and web regression
        shell: pwsh
        timeout-minutes: 19
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: '1'
        run: |
          $env:PYTHONPATH=(Get-Location).Path
          python -u tests/full_regression.py *>&1 | Tee-Object -FilePath deep-regression.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload deep audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-engineering-audit-${{ github.run_id }}
          path: |
            formula-audit.log
            deep-regression.log
            fbd-engineering-*.png
            fbd-boom-*.png
          if-no-files-found: ignore
