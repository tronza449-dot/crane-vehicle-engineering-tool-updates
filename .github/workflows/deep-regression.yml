name: Deep Engineering Regression (Extended QA)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deep-regression.yml
      - tests/full_regression.py
  workflow_run:
    workflows:
      - Build Windows Installer and Publish Update
    types:
      - completed

permissions:
  contents: read

jobs:
  extended-audit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout released source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install testing dependencies
        shell: pwsh
        run: python -m pip install -r requirements-build.txt
      - name: Full engineering regression - math UI PDF and reports
        shell: pwsh
        run: |
          $env:PYTHONPATH=(Get-Location).Path
          python -u tests/full_regression.py *>&1 | Tee-Object -FilePath regression.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload detailed audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cveh-deep-audit-log-${{ github.run_id }}
          path: regression.log
          if-no-files-found: ignore
